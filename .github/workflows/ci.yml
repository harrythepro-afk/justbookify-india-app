name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs, not tags. Update the SHA and the comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: dependencies do not get to run install scripts on the runner.
      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      # Regenerates the Storefront API types from the saved schema (no store, no token) and
      # fails if an operation does not validate or the committed types are out of date (D-055).
      - name: Generated GraphQL types are current
        run: npm run codegen:check

      - name: Tests
        run: npm run test:ci

      - name: Dependency audit
        run: npm run audit:gate

  # The backend (D-159, D-164): its own package in backend/functions, with its own checks and its
  # own audit gate, which has no allowlist. No path filter: a required check must run on every
  # pull request, or a skipped check would block the merge.
  backend:
    name: 'Backend: lint, types, tests, audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      # The Firestore emulator needs Java 21 (Firebase CLI 15).
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Builds, then runs the Firestore rules and whoami tests inside the local emulators, project
      # demo-justbookify-india: nothing reaches a real Firebase project (D-160).
      - name: Emulator tests
        run: npm run emulators:test

      - name: Dependency audit (no allowlist)
        run: npm run audit:gate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scan covers the whole history, not only the latest commit
          persist-credentials: false

      # The open-source gitleaks CLI (MIT), not the gitleaks-action, which needs a paid licence
      # for organisation accounts. Version and checksum are pinned.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan history for secrets
        run: ./gitleaks git --redact --no-banner --exit-code 1 --verbose .
